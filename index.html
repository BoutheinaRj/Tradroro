<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRADRLY — Smart Productivity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; background: #f0f4ff; }
      #root { height: 100%; }
      /* Scrollbar custom */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: #f1f5fe; }
      ::-webkit-scrollbar-thumb { background: #c7d9fc; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #2563eb; }
      /* Selection */
      ::selection { background: #2563eb22; color: #2563eb; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
